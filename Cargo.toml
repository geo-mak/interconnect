[package]
name = "interconnect"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High performance inter-process communication protocol"
repository = "https://github.com/geo-mak/interconnect"

rust-version = "1.92.0"

[dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
parking_lot = { version = "0.12.5" }
pin-project-lite = { version = "0.2.11" }

bincode =  { version = "2.0.1", features = ["serde", "derive"] }
serde = { version = "1.0.228", features = ["derive"] }

aes-gcm = { version = "0.10.3" }
aead = { version = "0.5.2" }
x25519-dalek = { version = "2.0.1" }
hkdf = "0.12.4"
sha2 = "0.10.9"